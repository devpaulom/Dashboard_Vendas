<title>Performance Comercial</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: cabeçalho com filtro de loja, 3 abas, grade de KPIs + gráficos */
:root{--bg:#f4f6f8;--card:#fff;--fg:#17202a;--mut:#5f6b78;--line:#e3e8ed;--grid:#edf0f3;
--s1:#257de0;--s2:#f47230;--s3:#00b894;--s4:#f2a600;--s5:#ee7fac;--good:#0a7d3b;--bad:#c23030;--warn:#b26a00;--accent:#257de0;--neutral:#e9edf1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101418;--card:#181d23;--fg:#eef1f4;--mut:#9aa5b1;--line:#2a323b;--grid:#232a32;--s1:#338ced;--s2:#e76624;--s3:#00a888;--s4:#d28e05;--s5:#e24d8b;--good:#3ec26f;--bad:#f06a6a;--warn:#e0a030;--accent:#338ced;--neutral:#262d35;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101418;--card:#181d23;--fg:#eef1f4;--mut:#9aa5b1;--line:#2a323b;--grid:#232a32;--s1:#338ced;--s2:#e76624;--s3:#00a888;--s4:#d28e05;--s5:#e24d8b;--good:#3ec26f;--bad:#f06a6a;--warn:#e0a030;--accent:#338ced;--neutral:#262d35;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:'Space Grotesk',Inter,sans-serif;margin:0;font-weight:600;text-wrap:balance}
h1{font-size:24px}h2{font-size:15px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between}
.sub{color:var(--mut);font-size:13px;margin-top:2px}
.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
select{font:inherit;font-size:13px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-size:14px;font-weight:500;background:none;border:0;color:var(--mut);padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--fg);border-color:var(--accent)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(12,1fr)}
.grid>*{min-width:0}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.kpi,.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi .l{font-size:12px;color:var(--mut)}.kpi .v{font-family:'Space Grotesk';font-size:24px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--mut);margin-top:2px}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}
@media(max-width:820px){.c8,.c7,.c6,.c5,.c4{grid-column:span 12}}
.card h2{margin-bottom:2px}.card .n{font-size:12px;color:var(--mut);margin-bottom:10px}
svg{width:100%;height:auto;display:block}svg text{fill:var(--mut);font-size:11px;font-family:Inter,sans-serif}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:0 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th{font-weight:500;color:var(--mut);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);font-size:12px;white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
.pill{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--neutral)}
.alert{border:1px solid var(--warn);color:var(--fg);background:var(--card);border-radius:10px;padding:10px 14px;font-size:13px}
.alert b{color:var(--warn)}

.btn{font:inherit;font-size:13px;font-weight:500;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
.btn.sec{background:var(--card);color:var(--fg);border:1px solid var(--line)}.btn:disabled{opacity:.4;cursor:not-allowed}
.drop{display:flex;flex-direction:column;align-items:center;gap:2px;border:1.5px dashed var(--line);border-radius:10px;padding:22px;cursor:pointer;font-size:13px;color:var(--mut)}
.drop b{color:var(--fg);font-weight:500}.drop.on,.drop:hover{border-color:var(--accent)}
.msg{display:flex;gap:8px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--grid)}.msg i{font-style:normal;font-weight:600;min-width:42px;font-size:11px;padding-top:1px}
.msg .ok{color:var(--good)}.msg .warn{color:var(--warn)}.msg .err{color:var(--bad)}
.msg>i.ok{color:var(--good)}.msg>i.warn{color:var(--warn)}.msg>i.err{color:var(--bad)}
.er rect.box{fill:var(--card);stroke:var(--line)}.er text{font-size:11px}.er .t{fill:var(--fg);font-weight:600;font-size:13px}.er .tag{fill:var(--accent);font-weight:600;font-size:10px}.er .f{fill:var(--fg)}

[hidden]{display:none!important}
.login{min-height:80vh;display:flex;align-items:center;justify-content:center}
.lcard{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px;display:flex;flex-direction:column;gap:14px}
.lcard label{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:5px}
.lcard input{font:inherit;font-size:14px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.lcard input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.lerr{font-size:13px;color:var(--bad);min-height:18px}
.lcard .btn{padding:10px 14px}
#tip{position:fixed;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:6px;z-index:20;display:none;max-width:240px;line-height:1.4}
[data-tip]{cursor:default}
</style>
<div class="login" id="login"><form class="lcard" id="lf" autocomplete="on">
 <div><h1>Performance Comercial</h1><div class="sub">Entre para ver os dashboards</div></div>
 <label for="lu">Usuário<input id="lu" name="username" autocomplete="username" required autofocus></label>
 <label for="lp">Senha<input id="lp" name="password" type="password" autocomplete="current-password" required></label>
 <div class="lerr" id="le" role="alert"></div>
 <button class="btn" id="lb" type="submit">Entrar</button>
</form></div>
<div class="wrap" id="app" hidden>

const MES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
let CAT=['Mercearia','Laticínios','Limpeza','Bebidas'];
let prod,lojas;
function setData(d){D=d;prod=Object.fromEntries(D.P.map(p=>[p[0],{id:p[0],nome:p[1],cat:p[2],ref:p[3]}]));lojas=Object.fromEntries(D.L.map(l=>[l[0],{id:l[0],nome:l[1],cidade:l[2]}]));loja='all';fillSel()}
const cv=i=>`var(--s${i+1})`;
const brl=v=>'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const brl0=v=>'R$ '+Math.round(v).toLocaleString('pt-BR');
const num=v=>Math.round(v).toLocaleString('pt-BR');
const pct=(v,d=1)=>(v*100).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d})+'%';
const short=v=>v>=1000?(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil':num(v);
var loja='all',tab=0;
const rows=()=>D.rows.filter(r=>loja==='all'||r[1]==loja).map(r=>({m:r[0],l:r[1],p:r[2],q:r[3],b:r[4],d:r[5],n:r[6],f:r[4]-r[5]}));
const metas=()=>D.metas.filter(r=>loja==='all'||r[1]==loja);
const sum=(a,k)=>a.reduce((s,x)=>s+(typeof k==='function'?k(x):x[k]),0);
function groupBy(a,key){const m=new Map();a.forEach(x=>{const k=key(x);(m.get(k)||m.set(k,[]).get(k)).push(x)});return m}
const esc=s=>String(s).replace(/"/g,'&quot;');
const tip=(t)=>`data-tip="${esc(t)}"`;

/* ---------- chart primitives ---------- */
function hbar(items,{fmt=brl0,color=()=> 'var(--s1)',w=520,lw=120,rh=26}={}){
 const max=Math.max(...items.map(i=>i.v))||1,H=items.length*rh+4,bw=w-lw-70;
 return `<svg viewBox="0 0 ${w} ${H}" role="img">`+items.map((it,i)=>{const y=i*rh+2,l=Math.max(2,it.v/max*bw);
 return `<g ${tip(it.tip||it.label+': '+fmt(it.v))}><rect x="0" y="${y}" width="${w}" height="${rh}" fill="transparent"/><text x="0" y="${y+rh/2+4}">${it.label}</text><path d="M${lw} ${y+4}h${l-4}a4 4 0 0 1 4 4v${rh-16}a4 4 0 0 1 -4 4h-${l-4}z" fill="${color(it,i)}"/><text x="${lw+l+6}" y="${y+rh/2+4}" style="fill:var(--fg)">${fmt(it.v)}</text></g>`}).join('')+'</svg>';
}
function columns({series,labels,line,w=720,h=260,stack=true,colors}){ // series: [{name,vals}]
 const pl=44,pb=22,pt=10,pr=8,iw=w-pl-pr,ih=h-pb-pt,n=labels.length;
 const tot=labels.map((_,i)=>stack?sum(series,s=>s.vals[i]):Math.max(...series.map(s=>s.vals[i])));
 let max=Math.max(...tot,...(line?line.vals:[0]))*1.08||1;
 const nice=(()=>{const p=Math.pow(10,Math.floor(Math.log10(max)));return Math.ceil(max/p*2)/2*p})();max=nice;
 const y=v=>pt+ih-v/max*ih,bw=iw/n*0.62,x=i=>pl+iw/n*(i+0.5);
 let o=`<svg viewBox="0 0 ${w} ${h}" role="img">`;
 for(let t=0;t<=4;t++){const v=max/4*t;o+=`<line x1="${pl}" x2="${w-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${short(v)}</text>`}
 labels.forEach((lb,i)=>{
  let acc=0;const tt=lb+'\n'+series.map(s=>s.name+': '+brl0(s.vals[i])).join('\n')+(line?'\n'+line.name+': '+brl0(line.vals[i]):'');
  o+=`<g ${tip(tt)}><rect x="${x(i)-iw/n/2}" y="${pt}" width="${iw/n}" height="${ih}" fill="transparent"/>`;
  series.forEach((s,k)=>{const v=s.vals[i],base=stack?acc:0,top=base+v,sw=stack?bw:bw/series.length,sx=stack?x(i)-bw/2:x(i)-bw/2+k*sw;
   if(v>0)o+=`<rect x="${sx}" y="${y(top)+(stack&&k>0?1:0)}" width="${sw-(stack?0:2)}" height="${Math.max(0,y(base)-y(top)-(stack&&k>0?2:0))}" rx="2" fill="${colors[k]}"/>`;acc+=v});
  o+=`<text x="${x(i)}" y="${h-6}" text-anchor="middle">${lb}</text></g>`});
 if(line){o+=`<polyline fill="none" stroke="var(--fg)" stroke-width="2" stroke-dasharray="5 4" points="${line.vals.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>`}
 return o+'</svg>';
}
const legend=(a)=>`<div class="legend">`+a.map(([n,c,d])=>`<span><i style="background:${c||'transparent'};${d?'border-top:2px dashed var(--fg);height:0;border-radius:0;vertical-align:3px;background:none':''}"></i>${n}</span>`).join('')+`</div>`;
const kpi=(l,v,d='')=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="d">${d}</div></div>`;

/* ---------- dashboards ---------- */
function totals(){const r=rows(),m=metas();const f=sum(r,'f'),b=sum(r,'b'),mt=sum(m,2);
 return {r,m,f,b,mt,q:sum(r,'q'),n:sum(r,'n'),desc:sum(r,'d'),ati:f/mt}}
function dash1(){
 const T=totals(),r=T.r;
 const byM=groupBy(r,x=>x.m),meta=groupBy(T.m,x=>x[0]);
 const monthly=MES.map((_,i)=>sum(byM.get(i+1)||[],'f')),mm=MES.map((_,i)=>sum(meta.get(i+1)||[],2));
 const cat=CAT.map((c,i)=>({label:c,v:sum(r.filter(x=>prod[x.p].cat===c),'f'),i}));
 const lj=Object.values(lojas).map(l=>({label:l.nome,v:sum(r.filter(x=>x.l===l.id),'f'),l:l.id}));
 const best=monthly.indexOf(Math.max(...monthly));
 return `<div class="kpis">
  ${kpi('Faturamento líquido',brl0(T.f),'após descontos')}
  ${kpi('Meta do ano',brl0(T.mt))}
  ${kpi('Atingimento da meta',pct(T.ati),'faturamento ÷ meta')}
  ${kpi('Vendas',num(T.n),num(T.q)+' itens')}
  ${kpi('Ticket médio',brl(T.f/T.n),'por venda')}
  ${kpi('Desconto médio',pct(T.desc/T.b),brl0(T.desc)+' concedidos')}
 </div>
 <div class="grid" style="margin-top:14px">
  <div class="card c12"><h2>Faturamento mensal</h2><div class="n">Melhor mês: ${MES[best]} (${brl0(monthly[best])}). A comparação com a meta está na aba Lojas e metas.</div>
   ${columns({series:[{name:'Faturamento',vals:monthly}],labels:MES,colors:['var(--s1)'],h:240})}</div>
  <div class="card c6"><h2>Faturamento por categoria</h2><div class="n">Participação no total</div>
   ${hbar(cat.sort((a,b)=>b.v-a.v).map(c=>({...c,tip:c.label+': '+brl0(c.v)+' ('+pct(c.v/T.f)+')'})),{color:c=>cv(CAT.indexOf(c.label))})}</div>
  <div class="card c6"><h2>Faturamento por loja</h2><div class="n">Participação no total</div>
   ${hbar(lj.sort((a,b)=>b.v-a.v).map(c=>({...c,tip:c.label+' ('+lojas[c.l].cidade+'): '+brl0(c.v)+' ('+pct(c.v/T.f)+')'})),{color:c=>cv(c.l-1)})}</div>
 </div>`;
}
function dash2(){
 const T=totals(),r=T.r;
 const pr=Object.values(prod).map(p=>{const a=r.filter(x=>x.p===p.id),q=sum(a,'q'),b=sum(a,'b'),f=sum(a,'f');return {...p,q,f,b,medio:q?b/q:0,desc:b?1-f/b:0}}).sort((a,b)=>b.f-a.f);
 const byM=groupBy(r,x=>x.m);
 const ser=CAT.map(c=>({name:c,vals:MES.map((_,i)=>sum((byM.get(i+1)||[]).filter(x=>prod[x.p].cat===c),'f'))}));
 const top=pr[0],low=pr[pr.length-1];
 return `<div class="kpis">
  ${kpi('Produtos vendidos',pr.filter(p=>p.q>0).length+' de '+pr.length)}
  ${kpi('Itens vendidos',num(T.q))}
  ${kpi('Campeão de faturamento',top.nome,brl0(top.f)+' · '+pct(top.f/T.f)+' do total')}
  ${kpi('Menor faturamento',low.nome,brl0(low.f))}
 </div>
 <div class="grid" style="margin-top:14px">
  <div class="card c6"><h2>Ranking de produtos</h2><div class="n">Faturamento líquido, cor = categoria</div>
   ${legend(CAT.map((c,i)=>[c,cv(i)]))}
   ${hbar(pr.map(p=>({label:p.nome,v:p.f,cat:p.cat,tip:p.nome+' ('+p.cat+')\n'+brl0(p.f)+' · '+num(p.q)+' itens'})),{color:p=>cv(CAT.indexOf(p.cat)),lw:130})}</div>
  <div class="card c6"><h2>Categorias ao longo do ano</h2><div class="n">Faturamento mensal empilhado</div>
   ${legend(CAT.map((c,i)=>[c,cv(i)]))}
   ${columns({series:ser,labels:MES,colors:CAT.map((_,i)=>cv(i)),w:560,h:300})}</div>
  <div class="card c12"><h2>Detalhe por produto</h2><div class="n">Preço médio praticado (bruto) comparado ao preço de referência</div>
   <div class="tw"><table><thead><tr><th>Produto</th><th>Categoria</th><th>Qtd.</th><th>Faturamento</th><th>% do total</th><th>Preço ref.</th><th>Preço médio</th><th>Var. vs ref.</th><th>Desc. médio</th></tr></thead><tbody>
   ${pr.map(p=>{const v=p.medio/p.ref-1;return `<tr><td>${p.nome}</td><td><span class="pill">${p.cat}</span></td><td>${num(p.q)}</td><td>${brl0(p.f)}</td><td>${pct(p.f/T.f)}</td><td>${brl(p.ref)}</td><td>${brl(p.medio)}</td><td style="color:${Math.abs(v)<.02?'var(--mut)':v>0?'var(--good)':'var(--bad)'}">${v>0?'+':''}${pct(v)}</td><td>${pct(p.desc)}</td></tr>`}).join('')}
   </tbody></table></div></div>
 </div>`;
}
function dash3(){
 const T=totals(),R=T.r;
 const ls=Object.values(lojas).filter(l=>loja==='all'||l.id==loja).map(l=>{const a=R.filter(x=>x.l===l.id),f=sum(a,'f'),mt=sum(D.metas.filter(x=>x[1]===l.id),2),b=sum(a,'b');
  return {...l,f,mt,ati:f/mt,gap:mt-f,n:sum(a,'n'),tk:f/sum(a,'n'),desc:sum(a,'d')/b}}).sort((a,b)=>b.ati-a.ati);
 const fm=(l,m)=>{const f=sum(R.filter(x=>x.l===l&&x.m===m),'f'),mt=sum(D.metas.filter(x=>x[1]===l&&x[0]===m),2);return {f,mt,a:mt?f/mt:0}};
 const all=ls.flatMap(l=>MES.map((_,i)=>fm(l.id,i+1).a)),mx=Math.max(...all)||1;
 const cw=52,rh=30,lw=96,W=lw+cw*12+4,H=rh*ls.length+26;
 const heat=`<svg viewBox="0 0 ${W} ${H}" role="img" style="min-width:640px">`+MES.map((m,i)=>`<text x="${lw+cw*i+cw/2}" y="14" text-anchor="middle">${m}</text>`).join('')+
  ls.map((l,j)=>`<text x="0" y="${26+j*rh+rh/2+4}">${l.nome}</text>`+MES.map((_,i)=>{const c=fm(l.id,i+1),t=c.a/mx;
   return `<g ${tip(l.nome+' · '+MES[i]+'\nFaturado: '+brl0(c.f)+'\nMeta: '+brl0(c.mt)+'\nAtingimento: '+pct(c.a))}><rect x="${lw+cw*i+1}" y="${26+j*rh+1}" width="${cw-2}" height="${rh-2}" rx="3" fill="color-mix(in srgb,var(--s1) ${Math.round(12+t*78)}%,var(--card))"/><text x="${lw+cw*i+cw/2}" y="${26+j*rh+rh/2+4}" text-anchor="middle" style="fill:${t>.55?'#fff':'var(--fg)'}">${pct(c.a,1).replace('%','')}</text></g>`}).join('')).join('')+'</svg>';
 const status=a=>a>=1?['Meta batida','var(--good)']:a>=.9?['Perto da meta','var(--warn)']:['Abaixo da meta','var(--bad)'];
 return `<div class="kpis">
  ${kpi('Atingimento geral',pct(T.ati),status(T.ati)[0])}
  ${kpi('Faturamento',brl0(T.f))}
  ${kpi('Meta',brl0(T.mt))}
  ${kpi('Distância da meta',brl0(T.mt-T.f),'falta para atingir')}
  ${kpi('Melhor loja',ls[0].nome,pct(ls[0].ati)+' da meta')}
 </div>
 ${T.ati<.5?`<div class="alert" style="margin-top:14px"><b>Atenção à escala das metas.</b> As metas somam ${brl0(T.mt)} no ano e o faturamento registrado soma ${brl0(T.f)}. Confira se as metas estão na mesma unidade da tabela de vendas.</div>`:''}
 <div class="grid" style="margin-top:14px">
  <div class="card c12"><h2>Atingimento da meta por loja e mês</h2><div class="n">Faturamento ÷ meta (%). Cor mais escura = maior atingimento.</div><div class="tw">${heat}</div></div>
  <div class="card c5"><h2>Faturamento vs. meta por loja</h2><div class="n">Barra = faturamento, traço = meta (mesma escala)</div>${goal(ls)}</div>
  <div class="card c7"><h2>Ranking de lojas</h2><div class="n">Ordenado por atingimento</div><div class="tw"><table><thead><tr><th>Loja</th><th>Cidade</th><th>Faturamento</th><th>Meta</th><th>Atingimento</th><th>Ticket</th><th>Desc.</th></tr></thead><tbody>
  ${ls.map(l=>{const s=status(l.ati);return `<tr><td>${l.nome}</td><td>${l.cidade}</td><td>${brl0(l.f)}</td><td>${brl0(l.mt)}</td><td style="color:${s[1]}">${pct(l.ati)}</td><td>${brl(l.tk)}</td><td>${pct(l.desc)}</td></tr>`}).join('')}
  </tbody></table></div></div>
 </div>`;
}
function goal(ls){const mx=Math.max(...ls.map(l=>Math.max(l.f,l.mt)))||1,w=460,lw=96,rh=34,bw=w-lw-10;
 return `<svg viewBox="0 0 ${w} ${ls.length*rh+4}">`+ls.map((l,i)=>{const y=i*rh+4;
 return `<g ${tip(l.nome+'\nFaturado: '+brl0(l.f)+'\nMeta: '+brl0(l.mt)+'\nAtingimento: '+pct(l.ati))}><rect x="0" y="${y}" width="${w}" height="${rh-4}" fill="transparent"/><text x="0" y="${y+16}">${l.nome}</text><rect x="${lw}" y="${y+4}" width="${l.mt/mx*bw}" height="14" rx="3" fill="var(--neutral)"/><rect x="${lw}" y="${y+4}" width="${Math.max(2,l.f/mx*bw)}" height="14" rx="3" fill="${cv(l.id-1)}"/><line x1="${lw+l.mt/mx*bw}" x2="${lw+l.mt/mx*bw}" y1="${y}" y2="${y+22}" stroke="var(--fg)" stroke-width="2"/></g>`}).join('')+'</svg>'}


/* ---------- fontes e relacionamentos ---------- */
const SCHEMA={Vendas:{role:'Tabela fato',cols:[['ID_Venda','PK'],['Data',''],['ID_Produto','FK'],['ID_Loja','FK'],['Quantidade',''],['Preco_Unitario',''],['Desconto','']],desc:'Uma linha por venda'},
 Produtos:{role:'Dimensão',cols:[['ID_Produto','PK'],['Produto',''],['Categoria',''],['Preco_Referencia','']],desc:'Catálogo e categorias'},
 Lojas:{role:'Dimensão',cols:[['ID_Loja','PK'],['Loja',''],['Cidade','']],desc:'Lojas e cidades'},
 Metas:{role:'Tabela de metas',cols:[['Mes',''],['ID_Loja','FK'],['Meta_Faturamento','']],desc:'Meta mensal por loja'}};
function box(x,y,w,n){const s=SCHEMA[n],h=44+s.cols.length*18+8;
 return `<g><rect class="box" x="${x}" y="${y}" width="${w}" height="${h}" rx="8"/><text class="t" x="${x+12}" y="${y+20}">${n}</text><text x="${x+w-12}" y="${y+20}" text-anchor="end">${s.role}</text><line x1="${x}" x2="${x+w}" y1="${y+30}" y2="${y+30}" stroke="var(--line)"/>`+
 s.cols.map((c,i)=>`<text class="f" x="${x+12}" y="${y+48+i*18}">${c[0]}</text><text class="tag" x="${x+w-12}" y="${y+48+i*18}" text-anchor="end">${c[1]}</text>`).join('')+`</g>`}
function link(x1,y1,x2,y2,l1,l2,lab,lx,ly){return `<path d="M${x1} ${y1}L${x2} ${y2}" stroke="var(--accent)" stroke-width="2" fill="none"/><text x="${x1+(x1<x2?6:-6)}" y="${y1-6}" text-anchor="${x1<x2?'start':'end'}" style="fill:var(--fg);font-weight:600">${l1}</text><text x="${x2+(x1<x2?-6:6)}" y="${y2-6}" text-anchor="${x1<x2?'end':'start'}" style="fill:var(--fg);font-weight:600">${l2}</text><text x="${lx}" y="${ly}" text-anchor="middle">${lab}</text>`}
function dash4(){
 const o=D.orf||{prod:0,loja:0,metaLoja:0,dup:0},cn=D.cnt;
 const er=`<svg class="er" viewBox="0 0 810 330" role="img" style="min-width:640px">${box(10,30,190,'Produtos')}${box(300,10,200,'Vendas')}${box(610,30,190,'Lojas')}${box(610,200,190,'Metas')}
 ${link(200,100,300,100,'1','N','ID_Produto',250,92)}${link(610,100,500,100,'1','N','ID_Loja',555,92)}${link(705,140,705,200,'1','N','',0,0)}<text x="715" y="174" style="fill:var(--mut)">ID_Loja</text></svg>`;
 const st=n=>n===0?['ok','Íntegro']:['warn',n+' sem correspondência'];
 const rel=[['Produtos → Vendas','ID_Produto','Um para muitos',o.prod],['Lojas → Vendas','ID_Loja','Um para muitos',o.loja],['Lojas → Metas','ID_Loja','Um para muitos',o.metaLoja]];
 return `<div class="kpis">${Object.keys(SCHEMA).map(n=>kpi(n,num(cn[n])+' linhas',SCHEMA[n].role+' · '+SCHEMA[n].cols.length+' colunas')).join('')}</div>
 <div class="grid" style="margin-top:14px">
 <div class="card c12"><h2>Modelo de dados</h2><div class="n">PK = chave primária, FK = chave estrangeira. Metas se liga às vendas pela loja e pelo mês.</div><div class="tw">${er}</div></div>
 <div class="card c7"><h2>Relacionamentos</h2><div class="n">Verificação de integridade na última carga</div><div class="tw"><table><thead><tr><th>Relação</th><th>Chave</th><th>Cardinalidade</th><th>Integridade</th></tr></thead><tbody>
 ${rel.map(r=>{const s=st(r[3]);return `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td style="color:var(--${s[0]==='ok'?'good':'warn'})">${s[1]}</td></tr>`}).join('')}
 <tr><td>Vendas</td><td>ID_Venda</td><td>Chave única</td><td style="color:var(--${o.dup?'warn':'good'})">${o.dup?o.dup+' duplicadas':'Sem duplicidade'}</td></tr></tbody></table></div></div>
 <div class="card c5"><h2>Medidas calculadas</h2><div class="n">Como os números dos dashboards são obtidos</div>
  <table><tbody><tr><td>Faturamento bruto</td><td>Qtd × Preço unitário</td></tr><tr><td>Desconto</td><td>Bruto × Desconto</td></tr><tr><td>Faturamento líquido</td><td>Bruto − Desconto</td></tr><tr><td>Ticket médio</td><td>Líquido ÷ nº de vendas</td></tr><tr><td>Atingimento</td><td>Líquido ÷ Meta</td></tr></tbody></table></div>
 <div class="card c12"><h2>Colunas por fonte</h2><div class="n">Origem: ${D.upd}</div><div class="tw"><table><thead><tr><th>Fonte</th><th>Descrição</th><th>Colunas</th></tr></thead><tbody>
 ${Object.keys(SCHEMA).map(n=>`<tr><td>${n}</td><td>${SCHEMA[n].desc}</td><td style="white-space:normal">${SCHEMA[n].cols.map(c=>c[0]).join(', ')}</td></tr>`).join('')}</tbody></table></div></div></div>`;

/* ---------- atualizar fontes ---------- */
let pend=null,LOG=[{t:'Carga inicial (arquivo original)',ok:1}];
const NEED={Vendas:['ID_Venda','Data','ID_Produto','ID_Loja','Quantidade','Preco_Unitario','Desconto'],Produtos:['ID_Produto','Produto','Categoria','Preco_Referencia'],Lojas:['ID_Loja','Loja','Cidade'],Metas:['Mes','ID_Loja','Meta_Faturamento']};
const mo=d=>{const x=d instanceof Date?new Date(d.getTime()+12*36e5):new Date(d);return {m:x.getUTCMonth()+1,y:x.getUTCFullYear(),t:x.getTime()}};
function build(wb,fname){
 const rep=[],S={};let ok=true;
 for(const n in NEED){const ws=wb.Sheets[n];if(!ws){rep.push(['err',`Aba "${n}" não encontrada`]);ok=false;continue}
  const j=XLSX.utils.sheet_to_json(ws,{raw:true}),cols=j.length?Object.keys(j[0]):[],miss=NEED[n].filter(c=>!cols.includes(c));
  if(!j.length||miss.length){rep.push(['err',`${n}: ${j.length?'faltam colunas '+miss.join(', '):'aba vazia'}`]);ok=false}else{S[n]=j;rep.push(['ok',`${n}: ${num(j.length)} linhas lidas`])}}
 if(!ok)return {ok:false,rep,fname};
 const P=S.Produtos.map(r=>[+r.ID_Produto,String(r.Produto),String(r.Categoria),+r.Preco_Referencia]),L=S.Lojas.map(r=>[+r.ID_Loja,String(r.Loja),String(r.Cidade)]);
 const pid=new Set(P.map(p=>p[0])),lid=new Set(L.map(l=>l[0]));
 const orf={prod:0,loja:0,metaLoja:0,dup:0},seen=new Set(),agg=new Map();let t0=Infinity,t1=-Infinity,nv=0,inval=0;
 S.Vendas.forEach(r=>{if(seen.has(r.ID_Venda))orf.dup++;seen.add(r.ID_Venda);
  const d=mo(r.Data),q=+r.Quantidade,pu=+r.Preco_Unitario,ds=+r.Desconto||0;
  if(!isFinite(d.t)||!isFinite(q)||!isFinite(pu)){inval++;return}
  if(!pid.has(+r.ID_Produto)){orf.prod++;return}if(!lid.has(+r.ID_Loja)){orf.loja++;return}
  t0=Math.min(t0,d.t);t1=Math.max(t1,d.t);nv++;const k=d.m+'|'+r.ID_Loja+'|'+r.ID_Produto;
  const a=agg.get(k)||[d.m,+r.ID_Loja,+r.ID_Produto,0,0,0,0];a[3]+=q;a[4]+=q*pu;a[5]+=q*pu*ds;a[6]++;agg.set(k,a)});
 const rows=[...agg.values()].map(a=>[a[0],a[1],a[2],a[3],+a[4].toFixed(2),+a[5].toFixed(2),a[6]]);
 const metas=[];S.Metas.forEach(r=>{if(!lid.has(+r.ID_Loja)){orf.metaLoja++;return}metas.push([mo(r.Mes).m,+r.ID_Loja,+r.Meta_Faturamento])});
 if(orf.prod)rep.push(['warn',`${orf.prod} vendas com produto inexistente foram ignoradas`]);
 if(orf.loja)rep.push(['warn',`${orf.loja} vendas com loja inexistente foram ignoradas`]);
 if(orf.metaLoja)rep.push(['warn',`${orf.metaLoja} metas com loja inexistente foram ignoradas`]);
 if(orf.dup)rep.push(['warn',`${orf.dup} IDs de venda repetidos`]);
 if(inval)rep.push(['warn',`${inval} vendas com data ou valor inválido foram ignoradas`]);
 const a=new Date(t0),b=new Date(t1),ya=a.getUTCFullYear(),yb=b.getUTCFullYear();
 const periodo=ya===yb?`${MES[a.getUTCMonth()]} a ${MES[b.getUTCMonth()]} de ${ya}`:`${MES[a.getUTCMonth()]}/${ya} a ${MES[b.getUTCMonth()]}/${yb}`;
 if(ya!==yb)rep.push(['warn','Há mais de um ano nas vendas: os meses iguais de anos diferentes serão somados']);
 rep.push(['ok',`Período: ${periodo}`]);
 const data={rows,metas,P,L,periodo,orf,upd:fname,cnt:{Vendas:nv,Produtos:P.length,Lojas:L.length,Metas:metas.length}};
 return {ok:true,rep,data,fname};
}
function pendHTML(){if(!pend)return '<div class="n" style="margin:12px 0 0">Nenhum arquivo selecionado.</div>';
 return `<div style="margin-top:12px"><div style="font-size:13px;font-weight:500;margin-bottom:4px">${pend.fname}</div>`+pend.rep.map(r=>`<div class="msg"><i class="${r[0]}">${{ok:'OK',warn:'AVISO',err:'ERRO'}[r[0]]}</i><span>${r[1]}</span></div>`).join('')+'</div>'}

 return `<div class="grid"><div class="card c7"><h2>Atualizar fontes</h2><div class="n">Envie uma nova versão da planilha com as abas Vendas, Produtos, Lojas e Metas. O arquivo é lido no seu navegador, sem envio para servidor.</div>
 <label class="drop" id="drop" tabindex="0"><input type="file" id="file" accept=".xlsx,.xlsm,.xls" hidden><b>Escolher arquivo .xlsx</b><span>ou arraste o arquivo para cá</span></label>
 <div id="prev">${pendHTML()}</div>
 <div class="ctl" style="margin-top:14px"><button class="btn" id="apply" ${pend&&pend.ok?'':'disabled'}>Aplicar atualização</button><button class="btn sec" id="reset">Restaurar dados originais</button></div>
 <div class="n" style="margin:10px 0 0">A atualização vale enquanto esta página estiver aberta. Ao recarregar, volta a planilha original.</div></div>
 <div class="card c5"><h2>Fontes carregadas</h2><div class="n">${D.upd}</div><table><thead><tr><th>Fonte</th><th>Linhas</th><th>Status</th></tr></thead><tbody>${Object.keys(NEED).map(n=>`<tr><td>${n}</td><td>${num(cn[n])}</td><td style="color:var(--good)">Carregada</td></tr>`).join('')}</tbody></table>
 <h2 style="margin-top:16px">Histórico</h2>${LOG.map(l=>`<div class="msg"><i class="ok">OK</i><span>${l.t}</span></div>`).join('')}</div></div>`;
}
function readFile(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{pend=build(XLSX.read(r.result,{type:'array',cellDates:true}),f.name)}catch(e){pend={ok:false,fname:f.name,rep:[['err','Não foi possível ler o arquivo: '+e.message]]}}render()};r.readAsArrayBuffer(f)}

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(u,p){
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(u.trim().toLowerCase()+':'+p),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.s),iterations:ENC.i,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.v)},key,b64(ENC.c));
 return JSON.parse(new TextDecoder().decode(buf));
}
